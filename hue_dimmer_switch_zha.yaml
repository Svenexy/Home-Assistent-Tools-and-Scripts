blueprint:
  name: ZHA - Philips Hue Dimmer Switch (actions, hold + release)
  description: >
    Run any actions on short press, hold, release after hold and double press
    of each button of a Philips Hue Dimmer (RWL020/RWL021).
    Use "hold" to start dimming and "release after hold" to stop it.
  domain: automation
  homeassistant:
    min_version: 2024.10.0
  input:
    remote:
      name: Philips Hue Dimmer Switch
      selector:
        device:
          filter:
            - integration: zha
              manufacturer: Philips
          entity:
            - domain:
                - sensor
              device_class:
                - battery
          multiple: false

    on_button:
      name: ON button
      icon: mdi:power
      collapsed: true
      input:
        on_short:
          name: Short press
          default: []
          selector:
            action:
        on_hold:
          name: Hold
          default: []
          selector:
            action:
        on_release:
          name: Release after hold
          default: []
          selector:
            action:
        on_double:
          name: Double press
          default: []
          selector:
            action:

    up_button:
      name: UP button
      icon: mdi:brightness-7
      collapsed: true
      input:
        up_short:
          name: Short press
          default: []
          selector:
            action:
        up_hold:
          name: Hold
          default: []
          selector:
            action:
        up_release:
          name: Release after hold
          default: []
          selector:
            action:
        up_double:
          name: Double press
          default: []
          selector:
            action:

    down_button:
      name: DOWN button
      icon: mdi:brightness-5
      collapsed: true
      input:
        down_short:
          name: Short press
          default: []
          selector:
            action:
        down_hold:
          name: Hold
          default: []
          selector:
            action:
        down_release:
          name: Release after hold
          default: []
          selector:
            action:
        down_double:
          name: Double press
          default: []
          selector:
            action:

    off_button:
      name: OFF button
      icon: mdi:power-off
      collapsed: true
      input:
        off_short:
          name: Short press
          default: []
          selector:
            action:
        off_hold:
          name: Hold
          default: []
          selector:
            action:
        off_release:
          name: Release after hold
          default: []
          selector:
            action:
        off_double:
          name: Double press
          default: []
          selector:
            action:

# restart: a release (or any new button event) cancels a running hold loop
mode: restart
max_exceeded: silent

triggers:
  - trigger: event
    event_type: zha_event
    event_data:
      device_id: !input remote
      cluster_id: 64512

actions:
  - variables:
      command: "{{ trigger.event.data.command }}"
  - choose:
      - conditions: "{{ command == 'on_short_release' }}"
        sequence: !input on_short
      - conditions: "{{ command == 'on_hold' }}"
        sequence: !input on_hold
      - conditions: "{{ command == 'on_long_release' }}"
        sequence: !input on_release
      - conditions: "{{ command == 'on_double_press' }}"
        sequence: !input on_double

      - conditions: "{{ command == 'up_short_release' }}"
        sequence: !input up_short
      - conditions: "{{ command == 'up_hold' }}"
        sequence:
          - repeat:
              count: 60
              sequence:
                - action: light.turn_on
                  target: !input up_hold
                  data:
                    brightness_step_pct: 10
                    transition: 0.4
                - delay:
                    milliseconds: 350
      - conditions: "{{ command == 'up_long_release' }}"
        sequence: !input up_release
      - conditions: "{{ command == 'up_double_press' }}"
        sequence: !input up_double

      - conditions: "{{ command == 'down_short_release' }}"
        sequence: !input down_short
      - conditions: "{{ command == 'down_hold' }}"
        sequence:
          - repeat:
              count: 60
              sequence:
                - action: light.turn_on
                  target: !input down_hold
                  data:
                    brightness_step_pct: -10
                    transition: 0.4
                - delay:
                    milliseconds: 350
      - conditions: "{{ command == 'down_long_release' }}"
        sequence: !input down_release
      - conditions: "{{ command == 'down_double_press' }}"
        sequence: !input down_double

      - conditions: "{{ command == 'off_short_release' }}"
        sequence: !input off_short
      - conditions: "{{ command == 'off_hold' }}"
        sequence: !input off_hold
      - conditions: "{{ command == 'off_long_release' }}"
        sequence: !input off_release
      - conditions: "{{ command == 'off_double_press' }}"
        sequence: !input off_double